<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #09090B;
    }

    .card {
      background: #18181B;
      border: 1px solid #27272A;
    }
  </style>
</head>

<body class="text-gray-200">

  <div class="max-w-7xl mx-auto p-4 md:p-8">

    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-10">
      <div>
        <h1 class="text-3xl md:text-4xl font-bold">
          ♠ Poker Dashboard
        </h1>
        <p class="text-gray-400 mt-1">
          Resultados • Estatísticas • Evolução
        </p>
      </div>

      <select class="bg-zinc-800 text-white rounded-lg px-4 py-2 border border-zinc-700 outline-none">
        <option>Dezembro 2026</option>
        <option>Novembro 2026</option>
        <option>Outubro 2026</option>
        <option>Setembro 2026</option>
        <option>Agosto 2026</option>
        <option>Julho 2026</option>
      </select>
    </div>

    <!-- Cards de Métricas -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-5">
      <div class="card rounded-xl p-6">
        <p class="text-gray-400 text-sm">Mãos</p>
        <h2 class="text-3xl font-bold mt-2">48.117</h2>
      </div>

      <div class="card rounded-xl p-6">
        <p class="text-gray-400 text-sm">Lucro</p>
        <h2 class="text-3xl font-bold text-green-400 mt-2">+$1.758</h2>
      </div>

      <div class="card rounded-xl p-6">
        <p class="text-gray-400 text-sm">BB/100</p>
        <h2 class="text-3xl font-bold text-cyan-400 mt-2">3.48</h2>
      </div>

      <div class="card rounded-xl p-6">
        <p class="text-gray-400 text-sm">Rakeback</p>
        <h2 class="text-3xl font-bold text-yellow-400 mt-2">$1.175</h2>
      </div>

      <div class="card rounded-xl p-6 col-span-2 md:col-span-1">
        <p class="text-gray-400 text-sm">Bankroll</p>
        <h2 class="text-3xl font-bold text-purple-400 mt-2">$1.923</h2>
      </div>
    </div>

    <!-- Gráficos Mensais Principais -->
    <div class="grid lg:grid-cols-2 gap-6 mt-8">
      <div class="card rounded-xl p-6">
        <h2 class="font-semibold text-xl mb-4">Lucro Mensal</h2>
        <canvas id="profitChart"></canvas>
      </div>

      <div class="card rounded-xl p-6">
        <h2 class="font-semibold text-xl mb-4">Bankroll Mensal</h2>
        <canvas id="bankrollChart"></canvas>
      </div>
    </div>

    <!-- Mãos por Limite, Volume Mensal e Metas -->
    <div class="grid lg:grid-cols-3 gap-6 mt-8">
      <div class="card rounded-xl p-6">
        <h2 class="text-xl font-semibold mb-4">Mãos por Limite</h2>
        <div class="relative h-64">
          <canvas id="stakesChart"></canvas>
        </div>
      </div>

      <div class="card rounded-xl p-6">
        <h2 class="text-xl font-semibold mb-4">Volume Mensal</h2>
        <div class="relative h-64">
          <canvas id="handsChart"></canvas>
        </div>
      </div>

      <div class="card rounded-xl p-6">
        <h2 class="text-xl font-semibold mb-4">Metas</h2>
        <div class="space-y-5">
          <div>
            <div class="flex justify-between mb-2 text-sm">
              <span>Mãos</span>
              <span>82%</span>
            </div>
            <div class="bg-zinc-700 h-3 rounded overflow-hidden">
              <div class="bg-green-500 h-3 rounded w-[82%]"></div>
            </div>
          </div>

          <div>
            <div class="flex justify-between mb-2 text-sm">
              <span>Horas</span>
              <span>61%</span>
            </div>
            <div class="bg-zinc-700 h-3 rounded overflow-hidden">
              <div class="bg-blue-500 h-3 rounded w-[61%]"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    Chart.defaults.color = "#A1A1AA";
    Chart.defaults.borderColor = "#27272A";

    // Gráfico de Lucro Mensal
    const ctxProfit = document.getElementById('profitChart');
    if (ctxProfit) {
      new Chart(ctxProfit, {
        type: 'line',
        data: {
          labels: ["Abr", "Mai", "Jun", "Jul", "Ago"],
          datasets: [{
            label: "Lucro Mensal ($)",
            data: [950, 1400, 1100, 1650, 1824],
            borderColor: "#22C55E",
            backgroundColor: "rgba(34, 197, 94, 0.2)",
            fill: true,
            tension: 0.35
          }]
        }
      });
    }

    // Gráfico de Bankroll Mensal
    const ctxBankroll = document.getElementById('bankrollChart');
    if (ctxBankroll) {
      new Chart(ctxBankroll, {
        type: 'line',
        data: {
          labels: ["Jul"],
          datasets: [{
            label: "Bankroll ($)",
            data: [1923],
            borderColor: "#8B5CF6",
            backgroundColor: "rgba(139, 92, 246, 0.2)",
            fill: true,
            tension: 0.35
          }]
        }
      });
    }

    // Dados de suporte para os limites
    const stakesData = {
      labels: ["NL50", "NL100"],
      hands: [48117],
      bb100: [3.48]
    };

    // Gráfico de Mãos por Limite
    const ctxStakes = document.getElementById('stakesChart');
    if (ctxStakes) {
      new Chart(ctxStakes, {
        type: 'bar',
        data: {
          labels: stakesData.labels,
          datasets: [{
            label: "Mãos",
            data: stakesData.hands,
            backgroundColor: "#3B82F6",
            barThickness: 32
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function (context) {
                  const index = context.dataIndex;
                  const handsVal = context.raw.toLocaleString();
                  const bbVal = stakesData.bb100[index];
                  return [
                    `Mãos: ${handsVal}`,
                    `🟩 Winrate: ${bbVal} BB/100`
                  ];
                }
              }
            }
          }
        }
      });
    }

    // Dados do Volume Mensal
    const monthlyData = {
      labels: ["Jul"],
      hands: [48117],
      profit: [1758],
      bb100: [3.48]
    };

    // Gráfico de Volume Mensal
    const ctxHands = document.getElementById('handsChart');
    if (ctxHands) {
      new Chart(ctxHands, {
        type: 'bar',
        data: {
          labels: monthlyData.labels,
          datasets: [{
            label: "Mãos",
            data: monthlyData.hands,
            backgroundColor: "#3B82F6",
            barThickness: 24
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              displayColors: false, // Desativa o quadrado nativo desalinhado
              callbacks: {
                label: function (context) {
                  const index = context.dataIndex;
                  const handsVal = context.raw.toLocaleString();
                  const profitVal = monthlyData.profit[index].toLocaleString();
                  const bbVal = monthlyData.bb100[index];
                  return [
                    `🟦 Mãos: ${handsVal}`,
                    `🟩 Lucro: +$${profitVal}`,
                    `🟩 Winrate: ${bbVal} BB/100`
                  ];
                }
              }
            }
          }
        }
      });
    }
  </script>

</body>

</html>
