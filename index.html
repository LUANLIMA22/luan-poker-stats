<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Dashboard</title>
  
  <!-- Configurações PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090B">
  <link rel="apple-touch-icon" href="icon.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Script do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, sans-serif; background: #09090B; }
    .card { background: #18181B; border: 1px solid #27272A; }
  </style>
</head>
<body class="text-gray-200">
  <div class="max-w-7xl mx-auto p-4 md:p-8">

    <div id="aviso-erro" class="hidden mb-6 p-4 bg-red-900/50 border border-red-500 text-red-200 rounded-xl text-center text-sm font-semibold"></div>

    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-10">
      <div>
        <h1 class="text-3xl md:text-4xl font-bold">♠ Poker Dashboard</h1>
        <p class="text-gray-400 mt-1">Resultados • Estatísticas • Evolução</p>
      </div>

      <div class="flex items-center gap-3">
        <!-- Botão Secreto para o Admin -->
        <a href="admin.html" class="bg-zinc-800 text-gray-400 hover:text-white rounded-lg p-2.5 border border-zinc-700 transition-colors" title="Painel Admin">
          ⚙️
        </a>

        <!-- Seletor com todos os meses de 2026 -->
        <select id="seletorMes" class="bg-zinc-800 text-white rounded-lg px-4 py-2 border border-zinc-700 outline-none cursor-pointer">
          <option value="Dezembro 2026">Dezembro 2026</option>
          <option value="Novembro 2026">Novembro 2026</option>
          <option value="Outubro 2026">Outubro 2026</option>
          <option value="Setembro 2026">Setembro 2026</option>
          <option value="Agosto 2026">Agosto 2026</option>
          <option value="Julho 2026" selected>Julho 2026</option>
          <option value="Junho 2026">Junho 2026</option>
          <option value="Maio 2026">Maio 2026</option>
          <option value="Abril 2026">Abril 2026</option>
          <option value="Março 2026">Março 2026</option>
          <option value="Fevereiro 2026">Fevereiro 2026</option>
          <option value="Janeiro 2026">Janeiro 2026</option>
        </select>
      </div>
    </div>

    <!-- Cards de Métricas (Banco de Dados) -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-5">
      <div class="card rounded-xl p-6">
        <p class="text-gray-400 text-sm">Mãos</p>
        <h2 id="card-maos" class="text-3xl font-bold mt-2">...</h2>
      </div>
      <div class="card rounded-xl p-6">
        <p class="text-gray-400 text-sm">Lucro</p>
        <h2 id="card-lucro" class="text-3xl font-bold mt-2 text-green-400">...</h2>
      </div>
      <div class="card rounded-xl p-6">
        <p class="text-gray-400 text-sm">BB/100</p>
        <h2 id="card-bb100" class="text-3xl font-bold text-cyan-400 mt-2">...</h2>
      </div>
      <div class="card rounded-xl p-6">
        <p class="text-gray-400 text-sm">Rakeback</p>
        <h2 id="card-rakeback" class="text-3xl font-bold text-yellow-400 mt-2">...</h2>
      </div>
      <div class="card rounded-xl p-6 col-span-2 md:col-span-1">
        <p class="text-gray-400 text-sm">Bankroll</p>
        <h2 id="card-bankroll" class="text-3xl font-bold text-purple-400 mt-2">...</h2>
      </div>
    </div>

    <!-- Mãos por Limite, Volume Mensal e Metas -->
    <div class="grid lg:grid-cols-3 gap-6 mt-8">
      <div class="card rounded-xl p-6">
        <h2 class="text-xl font-semibold mb-4">Mãos por Limite</h2>
        <div class="relative h-64">
          <canvas id="stakesChart"></canvas>
        </div>
      </div>
      <div class="card rounded-xl p-6">
        <h2 class="text-xl font-semibold mb-4">Mãos nos Últimos 6 Meses</h2>
        <div class="relative h-64">
          <canvas id="handsChart"></canvas>
        </div>
      </div>
      <div class="card rounded-xl p-6">
        <h2 class="text-xl font-semibold mb-4">Metas do Mês</h2>
        <div class="space-y-6">
          <div>
            <div class="flex justify-between items-end mb-1">
              <span class="font-semibold">Mãos</span>
              <span id="meta-maos-texto" class="text-green-400 font-bold">0%</span>
            </div>
            <div id="meta-maos-valores" class="text-xs text-gray-400 mb-2">0 / 0</div>
            <div class="bg-zinc-700 h-3 rounded overflow-hidden">
              <div id="meta-maos-barra" class="bg-green-500 h-3 rounded w-0 transition-all duration-500"></div>
            </div>
          </div>
          <div>
            <div class="flex justify-between items-end mb-1">
              <span class="font-semibold">Horas</span>
              <span id="meta-horas-texto" class="text-blue-400 font-bold">0%</span>
            </div>
            <div id="meta-horas-valores" class="text-xs text-gray-400 mb-2">0h / 0h</div>
            <div class="bg-zinc-700 h-3 rounded overflow-hidden">
              <div id="meta-horas-barra" class="bg-blue-500 h-3 rounded w-0 transition-all duration-500"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- RESUMO ANUAL (AUTOMÁTICO) -->
    <div class="card rounded-xl p-6 mt-8">
      <h2 class="text-xl font-semibold mb-4">🏆 Resumo Anual (Acumulado)</h2>
      
      <div class="flex flex-col md:flex-row gap-6 mb-6">
        <div class="bg-zinc-800/50 p-4 rounded-lg flex-1 border border-zinc-700">
          <p class="text-gray-400 text-sm">Total de Mãos no Ano</p>
          <h3 id="total-maos-ano" class="text-3xl font-bold mt-1 text-blue-400">0</h3>
        </div>
        <div class="bg-zinc-800/50 p-4 rounded-lg flex-1 border border-zinc-700">
          <p class="text-gray-400 text-sm">Lucro Total no Ano</p>
          <h3 id="total-lucro-ano" class="text-3xl font-bold mt-1 text-green-400">$0</h3>
        </div>
      </div>

      <div class="relative h-72">
        <canvas id="anualChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    Chart.defaults.color = "#A1A1AA";
    Chart.defaults.borderColor = "#27272A";

    // Banco de Dados Local SOMENTE para os Limites
    const dadosGraficos = {
      "Julho 2026": { limites: { maos: [12000, 22000, 14117], bb100: [4.2, 3.1, 3.48] } },
      "Agosto 2026": { limites: { maos: [15000, 28000, 13240], bb100: [9.8, 6.3, 4.7] } },
      "Setembro 2026": { limites: { maos: [0, 0, 0], bb100: [0, 0, 0] } }
    };

    const supabaseUrl = 'https://zhgnlcwdagxzphhqbkjp.supabase.co'; 
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpoZ25sY3dkYWd4enBoaHFia2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNjI1MzcsImV4cCI6MjEwMTYzODUzN30.QRDhAK8wQorNhUwFEV4lWx6BKKlbjoVXpa3ewh3j6qc';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    let stakesChart, handsChart, anualChart;

    const formatarMoeda = (valor) => (valor >= 0 ? "+$" : "-$") + Math.abs(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
    const formatarNumero = (valor) => (valor || 0).toLocaleString('pt-BR');

    function criarGraficosBase() {
      stakesChart = new Chart(document.getElementById('stakesChart'), { 
        type: 'bar', data: { labels: ["NL25", "NL50", "NL100"], datasets: [{ data: [0,0,0], backgroundColor: "#3B82F6", barThickness: 32 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });

      handsChart = new Chart(document.getElementById('handsChart'), { 
        type: 'bar', data: { labels: [], datasets: [{ data: [], backgroundColor: "#3B82F6", barThickness: 24 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });

      anualChart = new Chart(document.getElementById('anualChart'), {
        type: 'bar',
        data: {
          labels: [],
          datasets: [
            { type: 'line', label: 'Lucro ($)', data: [], borderColor: '#22C55E', backgroundColor: '#22C55E', borderWidth: 3, yAxisID: 'yLucro', tension: 0.3 },
            { type: 'bar', label: 'Mãos', data: [], backgroundColor: 'rgba(59, 130, 246, 0.6)', borderRadius: 4, yAxisID: 'yMaos' }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
          scales: {
            x: { grid: { display: false, color: '#27272A' } },
            yMaos: { type: 'linear', display: true, position: 'left', grid: { display: false }, ticks: { color: '#60A5FA' } },
            yLucro: { type: 'linear', display: true, position: 'right', grid: { color: '#27272A' }, ticks: { color: '#4ADE80' } }
          },
          plugins: { legend: { display: true, labels: { color: '#A1A1AA' } } }
        }
      });
    }

    async function carregarDados() {
      const mesSelecionado = document.getElementById('seletorMes').value;
      const aviso = document.getElementById('aviso-erro');
      aviso.classList.add('hidden');

      // 1. Atualizar Mãos Por Limite (Manual - Se existir)
      const dataGraficos = dadosGraficos[mesSelecionado];
      if (dataGraficos && dataGraficos.limites) {
        stakesChart.data.datasets[0].data = dataGraficos.limites.maos; stakesChart.update();
      } else {
        stakesChart.data.datasets[0].data = [0,0,0]; stakesChart.update();
      }

      // 2. BUSCAR TODOS OS MESES NO SUPABASE (Para Gráfico Anual e Últimos 6 Meses)
      const { data: todosDados, error: errTodos } = await supabaseClient
        .from('poker_stats')
        .select('mes_ano, maos_jogadas, lucro, bb_100');

      if (!errTodos && todosDados) {
        const mesesOrdem = { "Janeiro": 1, "Fevereiro": 2, "Março": 3, "Abril": 4, "Maio": 5, "Junho": 6, "Julho": 7, "Agosto": 8, "Setembro": 9, "Outubro": 10, "Novembro": 11, "Dezembro": 12 };
        
        // Ordena os meses em ordem cronológica
        todosDados.sort((a, b) => {
          let partsA = a.mes_ano.split(' ');
          let partsB = b.mes_ano.split(' ');
          if(partsA[1] !== partsB[1]) return parseInt(partsA[1] || 0) - parseInt(partsB[1] || 0);
          return (mesesOrdem[partsA[0]] || 0) - (mesesOrdem[partsB[0]] || 0);
        });

        // --- ATUALIZAR GRÁFICO ANUAL ---
        let somaMaos = 0, somaLucro = 0;
        let labelsAno = [], maosAno = [], lucroAno = [];

        todosDados.forEach(d => {
          somaMaos += (d.maos_jogadas || 0);
          somaLucro += (d.lucro || 0);
          let partes = d.mes_ano.split(' ');
          labelsAno.push(partes.length === 2 ? partes[0].substring(0,3) + '/' + partes[1].substring(2,4) : d.mes_ano);
          maosAno.push(d.maos_jogadas || 0);
          lucroAno.push(d.lucro || 0);
        });

        document.getElementById('total-maos-ano').innerText = formatarNumero(somaMaos);
        const elLucroAno = document.getElementById('total-lucro-ano');
        elLucroAno.innerText = formatarMoeda(somaLucro);
        elLucroAno.className = somaLucro < 0 ? "text-3xl font-bold mt-1 text-red-400" : "text-3xl font-bold mt-1 text-green-400";

        anualChart.data.labels = labelsAno;
        anualChart.data.datasets[0].data = lucroAno;
        anualChart.data.datasets[1].data = maosAno;
        anualChart.update();

        // --- ATUALIZAR GRÁFICO 6 MESES (AUTOMÁTICO) ---
        let selectedIdx = todosDados.findIndex(d => d.mes_ano === mesSelecionado);
        let ultimos6 = [];
        
        if (selectedIdx !== -1) {
          // Pega os 6 meses incluindo o mês selecionado
          let startIdx = Math.max(0, selectedIdx - 5);
          ultimos6 = todosDados.slice(startIdx, selectedIdx + 1);
        } else {
          // Se o mês selecionado não existir no banco, exibe os últimos 6 cadastrados no geral
          ultimos6 = todosDados.slice(-6);
        }

        handsChart.data.labels = ultimos6.map(d => d.mes_ano.split(' ')[0].substring(0,3));
        handsChart.data.datasets[0].data = ultimos6.map(d => d.maos_jogadas || 0);
        
        // Tooltip rica para o gráfico de 6 meses
        handsChart.options.plugins.tooltip = {
          displayColors: false,
          callbacks: {
            label: function(context) {
              let idx = context.dataIndex;
              let d = ultimos6[idx];
              return [
                `🟦 Mãos: ${formatarNumero(d.maos_jogadas)}`,
                `🟩 Lucro: ${formatarMoeda(d.lucro)}`,
                `🟩 Winrate: ${d.bb_100} BB/100`
              ];
            }
          }
        };
        handsChart.update();
      }

      // 3. Atualizar Cards e Metas do Mês Selecionado (Do Supabase)
      const { data, error } = await supabaseClient
        .from('poker_stats')
        .select('*')
        .eq('mes_ano', mesSelecionado)
        .maybeSingle();

      if (error) {
        aviso.classList.remove('hidden');
        aviso.innerText = '⚠️ Erro ao conectar ao banco de dados: ' + error.message;
        return;
      }

      if (!data) {
        document.getElementById('card-maos').innerText = '0';
        document.getElementById('card-lucro').innerText = '$0';
        document.getElementById('card-lucro').className = "text-3xl font-bold text-gray-400 mt-2";
        document.getElementById('card-bb100').innerText = '0';
        document.getElementById('card-rakeback').innerText = '$0';
        document.getElementById('card-bankroll').innerText = '$0';
        document.getElementById('meta-maos-valores').innerText = `0 / 0`;
        document.getElementById('meta-maos-texto').innerText = "0%";
        document.getElementById('meta-maos-barra').style.width = "0%";
        document.getElementById('meta-horas-valores').innerText = `0h / 0h`;
        document.getElementById('meta-horas-texto').innerText = "0%";
        document.getElementById('meta-horas-barra').style.width = "0%";
        return;
      }

      document.getElementById('card-maos').innerText = formatarNumero(data.maos_jogadas);
      const cardLucro = document.getElementById('card-lucro');
      cardLucro.innerText = formatarMoeda(data.lucro);
      cardLucro.className = data.lucro < 0 ? "text-3xl font-bold text-red-400 mt-2" : "text-3xl font-bold text-green-400 mt-2";
      document.getElementById('card-bb100').innerText = data.bb_100;
      document.getElementById('card-rakeback').innerText = "$" + formatarNumero(data.rakeback);
      document.getElementById('card-bankroll').innerText = "$" + formatarNumero(data.bankroll);

      const alvoM = data.alvo_maos || 1;
      const pctMaos = Math.round((data.maos_jogadas / alvoM) * 100);
      document.getElementById('meta-maos-valores').innerText = `${formatarNumero(data.maos_jogadas)} / ${formatarNumero(data.alvo_maos)}`;
      document.getElementById('meta-maos-texto').innerText = pctMaos + "%";
      document.getElementById('meta-maos-barra').style.width = Math.min(pctMaos, 100) + "%";

      const alvoH = data.alvo_horas || 1;
      const pctHoras = Math.round((data.horas_jogadas / alvoH) * 100);
      document.getElementById('meta-horas-valores').innerText = `${data.horas_jogadas}h / ${data.alvo_horas}h`;
      document.getElementById('meta-horas-texto').innerText = pctHoras + "%";
      document.getElementById('meta-horas-barra').style.width = Math.min(pctHoras, 100) + "%";
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    window.onload = function() {
      criarGraficosBase();
      carregarDados();
      document.getElementById('seletorMes').addEventListener('change', carregarDados);
    };
  </script>
</body>
</html>
