<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #09090B;
    }

    .card {
      background: #18181B;
      border: 1px solid #27272A;
    }
  </style>
</head>

<body class="text-gray-200">

  <div class="max-w-7xl mx-auto p-4 md:p-8">

    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-10">
      <div>
        <h1 class="text-3xl md:text-4xl font-bold">
          ♠ Poker Dashboard
        </h1>
        <p class="text-gray-400 mt-1">
          Resultados • Estatísticas • Evolução
        </p>
      </div>

      <select id="seletorMes" class="bg-zinc-800 text-white rounded-lg px-4 py-2 border border-zinc-700 outline-none cursor-pointer">
        <option value="Dezembro 2026">Dezembro 2026</option>
        <option value="Novembro 2026">Novembro 2026</option>
        <option value="Outubro 2026">Outubro 2026</option>
        <option value="Setembro 2026">Setembro 2026</option>
        <option value="Agosto 2026" selected>Agosto 2026</option>
        <option value="Julho 2026">Julho 2026</option>
      </select>
    </div>

    <!-- Cards de Métricas -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-5">
      <div class="card rounded-xl p-6">
        <p class="text-gray-400 text-sm">Mãos</p>
        <h2 id="card-maos" class="text-3xl font-bold mt-2">56.240</h2>
      </div>

      <div class="card rounded-xl p-6">
        <p class="text-gray-400 text-sm">Lucro</p>
        <h2 id="card-lucro" class="text-3xl font-bold text-green-400 mt-2">+$1.824</h2>
      </div>

      <div class="card rounded-xl p-6">
        <p class="text-gray-400 text-sm">BB/100</p>
        <h2 id="card-bb100" class="text-3xl font-bold text-cyan-400 mt-2">6.35</h2>
      </div>

      <div class="card rounded-xl p-6">
        <p class="text-gray-400 text-sm">Rakeback</p>
        <h2 id="card-rakeback" class="text-3xl font-bold text-yellow-400 mt-2">$412</h2>
      </div>

      <div class="card rounded-xl p-6 col-span-2 md:col-span-1">
        <p class="text-gray-400 text-sm">Bankroll</p>
        <h2 id="card-bankroll" class="text-3xl font-bold text-purple-400 mt-2">$7.415</h2>
      </div>
    </div>

    <!-- Gráficos Mensais Principais -->
    <div class="grid lg:grid-cols-2 gap-6 mt-8">
      <div class="card rounded-xl p-6">
        <h2 class="font-semibold text-xl mb-4">Lucro Mensal</h2>
        <canvas id="profitChart"></canvas>
      </div>

      <div class="card rounded-xl p-6">
        <h2 class="font-semibold text-xl mb-4">Bankroll Mensal</h2>
        <canvas id="bankrollChart"></canvas>
      </div>
    </div>

    <!-- Mãos por Limite, Volume Mensal e Metas -->
    <div class="grid lg:grid-cols-3 gap-6 mt-8">
      <div class="card rounded-xl p-6">
        <h2 class="text-xl font-semibold mb-4">Mãos por Limite</h2>
        <div class="relative h-64">
          <canvas id="stakesChart"></canvas>
        </div>
      </div>

      <div class="card rounded-xl p-6">
        <h2 class="text-xl font-semibold mb-4">Volume Mensal</h2>
        <div class="relative h-64">
          <canvas id="handsChart"></canvas>
        </div>
      </div>

      <div class="card rounded-xl p-6">
        <h2 class="text-xl font-semibold mb-4">Metas</h2>
        <div class="space-y-6">
          
          <!-- Meta de Mãos -->
          <div>
            <div class="flex justify-between items-end mb-1">
              <span class="font-semibold">Mãos</span>
              <span id="meta-maos-texto" class="text-green-400 font-bold">0%</span>
            </div>
            <div id="meta-maos-valores" class="text-xs text-gray-400 mb-2">50.000 / 0</div>
            <div class="bg-zinc-700 h-3 rounded overflow-hidden">
              <div id="meta-maos-barra" class="bg-green-500 h-3 rounded w-0 transition-all duration-500"></div>
            </div>
          </div>

          <!-- Meta de Horas -->
          <div>
            <div class="flex justify-between items-end mb-1">
              <span class="font-semibold">Horas</span>
              <span id="meta-horas-texto" class="text-blue-400 font-bold">0%</span>
            </div>
            <div id="meta-horas-valores" class="text-xs text-gray-400 mb-2">83.35h / 100h</div>
            <div class="bg-zinc-700 h-3 rounded overflow-hidden">
              <div id="meta-horas-barra" class="bg-blue-500 h-3 rounded w-0 transition-all duration-500"></div>
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>

  <script>
    Chart.defaults.color = "#A1A1AA";
    Chart.defaults.borderColor = "#27272A";

    // --- BANCO DE DADOS DOS MESES ---
    // Preencha seus resultados e metas reais aqui!
    const dadosDosMeses = {
      "Agosto 2026": {
        cards: { maos: "56.240", lucro: "+$1.824", bb100: "6.35", rakeback: "$412", bankroll: "$7.415" },
        // Agora você informa qual era a meta e quanto já jogou em horas
        metas: { alvoMaos: 60000, horasJogadas: 112, alvoHoras: 120 },
        charts: {
          lucroLinha: [950, 1400, 1100, 1650, 1824],
          bankrollLinha: [4200, 5100, 5800, 6400, 7415],
          limites: { maos: [15000, 28000, 13240], bb100: [9.8, 6.3, 4.7] },
          volume: { 
            labels: ["Abr", "Mai", "Jun", "Jul", "Ago"],
            maos: [42000, 58000, 61000, 53000, 56240], 
            lucro: [950, 1400, 1100, 1650, 1824], 
            bb100: [4.5, 6.0, 4.8, 7.8, 6.35] 
          }
        }
      },
      "Julho 2026": {
        cards: { maos: "48.117", lucro: "+$1.758", bb100: "3.48", rakeback: "$320", bankroll: "$6.400" },
        // Exemplo: Meta de julho era 50k hands, 130 horas e jogou 125h
        metas: { alvoMaos: 50000, horasJogadas: 125, alvoHoras: 130 },
        charts: {
          lucroLinha: [500, 900, 1200, 1400, 1758],
          bankrollLinha: [3800, 4600, 5200, 5800, 6400],
          limites: { maos: [12000, 22000, 14117], bb100: [4.2, 3.1, 3.48] },
          volume: { 
            labels: ["Mar", "Abr", "Mai", "Jun", "Jul"],
            maos: [35000, 42000, 58000, 61000, 48117], 
            lucro: [600, 950, 1400, 1100, 1758], 
            bb100: [3.5, 4.5, 6.0, 4.8, 3.48] 
          }
        }
      },
      "Setembro 2026": {
        cards: { maos: "0", lucro: "$0", bb100: "0.0", rakeback: "$0", bankroll: "$7.415" },
        metas: { alvoMaos: 60000, horasJogadas: 0, alvoHoras: 140 },
        charts: {
          lucroLinha: [0, 0, 0, 0, 0],
          bankrollLinha: [7415, 7415, 7415, 7415, 7415],
          limites: { maos: [0, 0, 0], bb100: [0, 0, 0] },
          volume: { 
            labels: ["Mai", "Jun", "Jul", "Ago", "Set"],
            maos: [58000, 61000, 53000, 56240, 0], 
            lucro: [1400, 1100, 1650, 1824, 0], 
            bb100: [6.0, 4.8, 7.8, 6.35, 0] 
          }
        }
      }
    };

    let profitChart, bankrollChart, stakesChart, handsChart;

    function criarGraficosBase() {
      // Cria a base vazia dos gráficos para depois ser preenchida via atualizarPainel()
      profitChart = new Chart(document.getElementById('profitChart'), {
        type: 'line', data: { labels: [], datasets: [{ label: "Lucro Mensal ($)", data: [], borderColor: "#22C55E", backgroundColor: "rgba(34, 197, 94, 0.2)", fill: true, tension: 0.35 }] }
      });

      bankrollChart = new Chart(document.getElementById('bankrollChart'), {
        type: 'line', data: { labels: [], datasets: [{ label: "Bankroll ($)", data: [], borderColor: "#8B5CF6", backgroundColor: "rgba(139, 92, 246, 0.2)", fill: true, tension: 0.35 }] }
      });

      stakesChart = new Chart(document.getElementById('stakesChart'), {
        type: 'bar', data: { labels: ["NL25", "NL50", "NL100"], datasets: [{ data: [], backgroundColor: "#3B82F6", barThickness: 32 }] },
        options: {
          responsive: true, maintainAspectRatio: false, plugins: {
            legend: { display: false },
            tooltip: {
              displayColors: false,
              callbacks: {
                label: function (context) {
                  const mesSelecionado = document.getElementById('seletorMes').value;
                  const dadosLimites = dadosDosMeses[mesSelecionado].charts.limites;
                  const index = context.dataIndex;
                  return [`🟦 Mãos: ${context.raw.toLocaleString()}`, `🟩 Winrate: ${dadosLimites.bb100[index]} BB/100`];
                }
              }
            }
          }
        }
      });

      handsChart = new Chart(document.getElementById('handsChart'), {
        type: 'bar', data: { labels: [], datasets: [{ data: [], backgroundColor: "#3B82F6", barThickness: 24 }] },
        options: {
          responsive: true, maintainAspectRatio: false, plugins: {
            legend: { display: false },
            tooltip: {
              displayColors: false,
              callbacks: {
                label: function (context) {
                  const mesSelecionado = document.getElementById('seletorMes').value;
                  const dadosVolume = dadosDosMeses[mesSelecionado].charts.volume;
                  const index = context.dataIndex;
                  return [
                    `🟦 Mãos: ${context.raw.toLocaleString()}`,
                    `🟩 Lucro: $${dadosVolume.lucro[index].toLocaleString()}`,
                    `🟩 Winrate: ${dadosVolume.bb100[index]} BB/100`
                  ];
                }
              }
            }
          }
        }
      });
    }

    function atualizarPainel() {
      const mesSelecionado = document.getElementById('seletorMes').value;
      const data = dadosDosMeses[mesSelecionado];
      if (!data) return;

      // 1. Atualizar Cards
      document.getElementById('card-maos').innerText = data.cards.maos;
      
      const cardLucro = document.getElementById('card-lucro');
      cardLucro.innerText = data.cards.lucro;
      cardLucro.className = data.cards.lucro.includes("-") ? "text-3xl font-bold text-red-400 mt-2" : "text-3xl font-bold text-green-400 mt-2";
      
      document.getElementById('card-bb100').innerText = data.cards.bb100;
      document.getElementById('card-rakeback').innerText = data.cards.rakeback;
      document.getElementById('card-bankroll').innerText = data.cards.bankroll;

      // 2. Atualizar e Calcular Metas Automaticamente
      
      // Cálculo de Mãos (Puxa os dados do card e remove os pontos para virar número puro)
      const maosJogadas = parseInt(data.cards.maos.replace(/\./g, '')) || 0;
      const alvoMaos = data.metas.alvoMaos || 1;
      const pctMaosReal = Math.round((maosJogadas / alvoMaos) * 100);
      const larguraBarraMaos = Math.min(pctMaosReal, 100); // Limita a barra visual a 100%

      document.getElementById('meta-maos-valores').innerText = `${maosJogadas.toLocaleString('pt-BR')} / ${alvoMaos.toLocaleString('pt-BR')}`;
      document.getElementById('meta-maos-texto').innerText = pctMaosReal + "%";
      document.getElementById('meta-maos-barra').style.width = larguraBarraMaos + "%";

      // Cálculo de Horas
      const horasJogadas = data.metas.horasJogadas || 0;
      const alvoHoras = data.metas.alvoHoras || 1;
      const pctHorasReal = Math.round((horasJogadas / alvoHoras) * 100);
      const larguraBarraHoras = Math.min(pctHorasReal, 100);

      document.getElementById('meta-horas-valores').innerText = `${horasJogadas}h / ${alvoHoras}h`;
      document.getElementById('meta-horas-texto').innerText = pctHorasReal + "%";
      document.getElementById('meta-horas-barra').style.width = larguraBarraHoras + "%";

      // 3. Atualizar Gráficos
      profitChart.data.labels = ["1ª Sem", "2ª Sem", "3ª Sem", "4ª Sem", "Fim"];
      profitChart.data.datasets[0].data = data.charts.lucroLinha;
      profitChart.update();

      bankrollChart.data.labels = ["1ª Sem", "2ª Sem", "3ª Sem", "4ª Sem", "Fim"];
      bankrollChart.data.datasets[0].data = data.charts.bankrollLinha;
      bankrollChart.update();

      stakesChart.data.datasets[0].data = data.charts.limites.maos;
      stakesChart.update();

      handsChart.data.labels = data.charts.volume.labels;
      handsChart.data.datasets[0].data = data.charts.volume.maos;
      handsChart.update();
    }

    // Inicia tudo
    window.onload = function() {
      criarGraficosBase();
      atualizarPainel();
      document.getElementById('seletorMes').addEventListener('change', atualizarPainel);
    };
  </script>

</body>

</html>
