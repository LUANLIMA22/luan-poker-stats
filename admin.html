<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Luan Poker Stats</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Script do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #09090B; color: #E5E7EB; font-family: sans-serif; }
    .input-field { background: #18181B; border: 1px solid #27272A; padding: 0.75rem; border-radius: 0.5rem; width: 100%; color: white; outline: none; margin-top: 0.25rem; }
    .input-field:focus { border-color: #3B82F6; }
  </style>
</head>
<body class="p-8">

  <div class="max-w-2xl mx-auto bg-[#18181B] border border-zinc-800 p-8 rounded-xl shadow-lg">
    <h1 class="text-3xl font-bold mb-2">⚙️ Painel de Controle</h1>
    <p class="text-gray-400 mb-8">Atualize as estatísticas do seu Dashboard de Poker.</p>

    <form id="adminForm" class="space-y-6">
      
      <div>
        <label class="text-sm text-gray-400">Mês e Ano (Ex: Setembro 2026)</label>
        <input type="text" id="mes_ano" class="input-field" required>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-sm text-gray-400">Mãos Jogadas</label>
          <input type="number" id="maos_jogadas" class="input-field" required>
        </div>
        <div>
          <label class="text-sm text-gray-400">Lucro (U$)</label>
          <input type="number" step="0.01" id="lucro" class="input-field" required>
        </div>
        <div>
          <label class="text-sm text-gray-400">BB/100</label>
          <input type="number" step="0.01" id="bb_100" class="input-field" required>
        </div>
        <div>
          <label class="text-sm text-gray-400">Rakeback (U$)</label>
          <input type="number" step="0.01" id="rakeback" class="input-field" required>
        </div>
        <div>
          <label class="text-sm text-gray-400">Bankroll (U$)</label>
          <input type="number" step="0.01" id="bankroll" class="input-field" required>
        </div>
      </div>

      <div class="border-t border-zinc-800 pt-6 grid grid-cols-3 gap-4">
        <div>
          <label class="text-sm text-gray-400">Meta de Mãos</label>
          <input type="number" id="alvo_maos" class="input-field" required>
        </div>
        <div>
          <label class="text-sm text-gray-400">Horas Jogadas</label>
          <input type="number" step="0.01" id="horas_jogadas" class="input-field" required>
        </div>
        <div>
          <label class="text-sm text-gray-400">Meta de Horas</label>
          <input type="number" step="0.01" id="alvo_horas" class="input-field" required>
        </div>
      </div>

      <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg transition-colors mt-4">
        💾 Salvar no Banco de Dados
      </button>
    </form>
    
    <div id="mensagem" class="mt-4 text-center font-semibold hidden"></div>
  </div>

  <script>
    // As suas chaves de API
    const supabaseUrl = 'https://zhgnlcwdagxzphhqbkjp.supabase.co'; 
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpoZ25sY3dkYWd4enBoaHFia2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNjI1MzcsImV4cCI6MjEwMTYzODUzN30.QRDhAK8wQorNhUwFEV4lWx6BKKlbjoVXpa3ewh3j6qc';
    
    // Inicia a conexão
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    // Quando clicar no botão de Salvar
    document.getElementById('adminForm').addEventListener('submit', async function(e) {
      e.preventDefault(); // Impede a página de recarregar e apagar tudo!
      
      const msg = document.getElementById('mensagem');
      msg.classList.remove('hidden', 'text-green-400', 'text-red-400');
      msg.classList.add('text-blue-400');
      msg.innerText = 'Salvando dados no Supabase...';

      // Capturando os dados do formulário
      const dados = {
        mes_ano: document.getElementById('mes_ano').value,
        maos_jogadas: parseInt(document.getElementById('maos_jogadas').value),
        lucro: parseFloat(document.getElementById('lucro').value),
        bb_100: parseFloat(document.getElementById('bb_100').value),
        rakeback: parseFloat(document.getElementById('rakeback').value),
        bankroll: parseFloat(document.getElementById('bankroll').value),
        alvo_maos: parseInt(document.getElementById('alvo_maos').value),
        horas_jogadas: parseFloat(document.getElementById('horas_jogadas').value),
        alvo_horas: parseFloat(document.getElementById('alvo_horas').value)
      };

      // Enviando para a tabela 'poker_stats' no Supabase
      const { data, error } = await supabaseClient
        .from('poker_stats')
        .upsert([dados], { onConflict: 'mes_ano' }); // Atualiza se o mês já existir

      // Removendo a cor azul de "Salvando..."
      msg.classList.remove('text-blue-400');

      if (error) {
        msg.classList.add('text-red-400');
        msg.innerText = 'Erro ao salvar: ' + error.message;
      } else {
        msg.classList.add('text-green-400');
        msg.innerText = '✅ Estatísticas salvas com sucesso!';
        document.getElementById('adminForm').reset();
      }
    });
  </script>
</body>
</html>
